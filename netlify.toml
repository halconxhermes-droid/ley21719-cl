[build]
  base = "frontend"
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Netlify Function que sirve /api/v1/* directo desde InsForge (sin Fly.io)
[functions]
  directory = "frontend/netlify/functions"

# Capturar todas las rutas /api/* con la función adapter (bypass backend Fly.io caído)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
