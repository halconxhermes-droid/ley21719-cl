[build]
  base = "frontend"
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ─── Netlify Functions ───
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirigir /api/* a la función adapter (force=true captura antes de SPA fallback)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback — DEBE ir al final
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
