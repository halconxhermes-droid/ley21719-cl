[build]
  base = "frontend"
  command = "cd frontend && pnpm install --frozen-lockfile && pnpm build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

# ─── Netlify Functions ───
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirigir /api/* a la función adapter (force=true captura antes de SPA fallback)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback — DEBE ir al final
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Ruta pública de verificación de certificados (QR) — captura ANTES del SPA
# (el SPA también la maneja, pero esto asegura que /verificar?cod=X sirva index.html)
[[redirects]]
  from = "/verificar"
  to = "/index.html"
  status = 200
  force = false
