[build]
  base = "frontend"
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirect /api/* to Cloudflare Tunnel (temporal mientras Fly.io se estabiliza)
[[redirects]]
  from = "/api/*"
  to = "https://ordinance-restrictions-daniel-accepts.trycloudflare.com/api/:splat"
  status = 200
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200