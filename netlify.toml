[build]
  base = "frontend"
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Redirect /api/* to backend público en Fly.io
[[redirects]]
  from = "/api/*"
  to = "https://ley21719-backend-ce8bed33-38b7-4dbe-bdc3-8738f5c4e991.fly.dev/api/:splat"
  status = 200
  force = true

# SPA fallback — importante para Vite Router (single-page app)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200