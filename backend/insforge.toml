[auth]
allowed_redirect_urls = ["http://localhost:5173", "https://ley21719-cl.netlify.app"]
require_email_verification = true
verify_email_method = "link"
reset_password_method = "code"
disable_signup = false

[auth.password]
min_length = 6
require_number = false
require_lowercase = false
require_uppercase = false
require_special_char = false

# Resend SMTP configuration
# Password uses InsForge secret: SMTP_PASSWORD (created via `insforge secrets add`)
[auth.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
username = "resend"
password = "env(SMTP_PASSWORD)"
sender_email = "onboarding@resend.dev"
sender_name = "Plataforma Ley 21.719"
min_interval_seconds = 60

[storage]
max_file_size_mb = 50

[realtime]
retention_days = 0

[schedules]
retention_days = 7
