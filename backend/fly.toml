app = "ley21719-backend-ce8bed33-38b7-4dbe-bdc3-8738f5c4e991"
primary_region = "scl"

[build]
  dockerfile = "Dockerfile"

[env]
  LEY21719_DATA_DIR = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[mounts]
  source = "ley21719_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
